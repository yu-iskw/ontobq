[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  ".git",
  ".venv",
  ".mypy_cache",
  ".ruff_cache",
  ".pyright",
  ".pytest_cache",
  ".github",
  ".trunk",
  "dev",
  "src/ontobq/tests",
  "dist",
  ".python-version",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ontobq"]

[tool.hatch.build.targets.wheel.force-include]
"src/ontobq/schema/v1alpha1.json" = "ontobq/schema/v1alpha1.json"

[project]
name = "ontobq"
version = "0.1.0"
authors = [{ name = "yu-iskw" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10.0"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
description = "Ontology-as-code compiler for BigQuery Property Graph"
dependencies = ["jsonschema>=4.23.0", "pyyaml>=6.0.2"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25.0", "urllib3>=2.7.0"]

[project.scripts]
ontobq = "ontobq.cli:main"

[tool.pytest.ini_options]
testpaths = ["src/ontobq/tests"]

[dependency-groups]
dev = [
  "xenon>=0.9.3",
  "pytest>=8.3.5",
  "pytest-cov>=6.0",
  "bandit>=1.8.3",
  "ruff>=0.15.0",
  "pyright>=1.1.0",
  "pylint>=3.3.5",
  "vulture>=2.16",
  "ssort>=0.16.0",
  "types-PyYAML>=6.0.12",
  "google-cloud-bigquery>=3.25.0",
  "urllib3>=2.7.0",
]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = "warning"

[tool.vulture]
paths = ["src/ontobq"]
min_confidence = 80

[tool.coverage.run]
branch = true
source = ["src/ontobq"]

[tool.coverage.report]
show_missing = true
omit = ["*/tests/*"]
