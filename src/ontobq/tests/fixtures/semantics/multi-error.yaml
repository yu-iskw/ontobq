apiVersion: ontobq.dev/v1alpha1
kind: Domain

metadata:
  name: commerce

spec:
  bigquery:
    project: my-project
    dataset: semantic
    graph: commerce_graph

  entities:
    Broken:
      key: [id, missing]
      properties:
        id:
          type: string
          nullable: false
      mapping:
        bigquery:
          source: my-project.raw.broken
          properties:
            id:
              column: broken_id

    Customer:
      key: [id]
      properties:
        id:
          type: string
          nullable: false
      mapping:
        bigquery:
          source: my-project.raw.customers
          properties:
            id:
              column: customer_id

  relationships:
    POINTS_AT:
      from: MissingEntity
      to: Customer
      mapping:
        bigquery:
          source: my-project.raw.customers
          key:
            - column: customer_id
          from:
            id:
              column: other_id
          to:
            id:
              column: customer_id
