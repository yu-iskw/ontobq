apiVersion: ontobq.dev/v1alpha1
kind: Domain

metadata:
  name: commerce

spec:
  bigquery:
    project: my-project
    dataset: semantic
    graph: commerce_graph

  entities:
    PLACED:
      key: [id]
      properties:
        id:
          type: string
          nullable: false
      mapping:
        bigquery:
          source: my-project.raw.customers
          properties:
            id:
              column: customer_id

  relationships:
    PLACED:
      from: PLACED
      to: PLACED
      mapping:
        bigquery:
          source: my-project.raw.customers
          key:
            - column: customer_id
          from:
            id:
              column: customer_id
          to:
            id:
              column: customer_id
