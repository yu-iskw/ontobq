apiVersion: ontobq.dev/v1alpha1
kind: Domain

metadata:
  name: commerce

spec:
  bigquery:
    project: my-project
    dataset: semantic
    graph: __ontobq_reserved

  entities:
    Customer:
      key: [id]
      properties:
        id:
          type: string
          nullable: false
      mapping:
        bigquery:
          source: my-project.raw.customers
          properties:
            id:
              column: customer_id
