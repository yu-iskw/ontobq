apiVersion: ontobq.dev/v1alpha1
kind: Domain

metadata:
  name: commerce

spec:
  bigquery:
    project: my-project
    dataset: semantic
    graph: commerce_graph

  entities:
    Order:
      key: [id]
      properties:
        id:
          type: string
          nullable: false
        status:
          type: string
        Status:
          type: string
      mapping:
        bigquery:
          source: my-project.raw.orders
          properties:
            id:
              column: order_id
            status:
              column: status
            Status:
              column: status_label
