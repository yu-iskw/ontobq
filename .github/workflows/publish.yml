name: Publish (pypi)

on:
  release:
    types:
      - created

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For repo checkout
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: ontobq
      PYTHON_NAME_SPACE: ontobq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          pip install -r requirements.setup.txt
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: "${{ secrets.PYPI_API_TOKEN }}"
        run: |
          bash dev/publish.sh "pypi"

  test-published-package:
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read # For repo checkout
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: ontobq
      PYTHON_NAME_SPACE: ontobq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
      # It takes some time when the package gets available.
      - name: Sleep
        run: |
          sleep 30
      - name: Install package
        run: |
          python3 -m pip install -U "${PYTHON_PACKAGE_NAME}"
      - name: Test package
        run: |
          python -c "import ${PYTHON_NAME_SPACE}"
