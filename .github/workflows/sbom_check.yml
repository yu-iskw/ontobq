name: SBOM check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: false
          cache: true

      - name: Install Trivy and Grype via mise
        run: mise install --locked trivy grype

      - name: Generate and scan CycloneDX SBOM
        env:
          # Keep this job SBOM-only: do not auto-install trunk/osv/codeql from [tools].
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run sbom-check

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: dist/sbom/sbom.cdx.json
          if-no-files-found: warn
